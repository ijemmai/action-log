syntax = "proto3";

package devvit.dev_portal.app.categories;

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/devportal/app/categories";

// Contains every valid category an App can have.
enum Categories {
  MODERATION = 0;
  CUSTOM_POSTS = 1;
  UTILITIES = 2;
  OTHER_SITES = 3;
  FUNNY = 4;
  WEIRD = 5;
  AWW = 6;
  LEARNING = 7;
  FINANCIAL = 8;
  SPORTS = 9;
  GAMES = 10;
  MOVIES = 11;
  MUSIC = 12;
  TV = 13;
  BOOKS = 14;
  ANIME = 15;
  PROGRAMMING = 16;
  COOKING = 17;
  FITNESS = 18;
  TRAVEL = 19;
  CONTEXT_MENU = 20;
  MOD_CONTEXT = 21;
  FILTER = 22;
  POST_FILTER = 23;
  COMMENT_FILTER = 24;
  ANTI_SPAM = 25;
  ANTI_HARASSMENT = 26;
  NSFW_FILTER = 27;
  CITIZEN_FILTER = 28;
  POST_FLAIR = 29;
  COMMENT_FLAIR = 30;
  USER_FLAIR = 31;
  MESSAGING = 32;
  MISCHIEF = 420;
}

message AppCategory {
  int32 id = 1; // ID of the category row
  string name = 2; // Human-readable category name
  optional int32 parent_id = 3; // ID of the parent category (empty if root)
  // Optional category display rank for dev rel to rank categories in the UI. Lower rank = higher priority.
  optional int32 rank = 4;
  // Manual override for which apps should be displayed first for this category. Values are app UUIDs.
  // For example, if a category's top apps are `uuid-01`, `uuid-02`, and `uuid-03`, but this is set to `['uuid-02', 'uuid-99']`,
  // then the category view will show, in order, `uuid-02`, `uuid-99`, then `uuid-01` and `uuid-03`. (`uuid-02` won't be shown twice.)
  repeated string top_apps_override = 5;
  // Optional link to a call-to-action for this category. For example, if the category is "PUZZLE", this could be a link to a page that lists all puzzle games.
  optional string cta_link = 6;
}

// Recursive category node that nests sub-categories inside each node.
message AppCategoryNode {
  AppCategory category = 1;
  repeated AppCategoryNode children = 2;
}

// Response wrapper for GetAllCategories returning the full category tree.
message AppCategoryNodeListResponse {
  repeated AppCategoryNode categories = 1;
}
