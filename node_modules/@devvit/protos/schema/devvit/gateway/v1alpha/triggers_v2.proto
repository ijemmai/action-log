syntax = "proto3";

package devvit.gateway.v1alpha;

import "devvit/dev_portal/installation/installation.proto";
import "devvit/triggers/v1alpha/triggers.proto";
import "google/protobuf/empty.proto";

option go_package = "github.snooguts.net/reddit/reddit-devplatform-monorepo/go-common/generated/protos/types/devvit/gateway";

// Producer of a TriggerInvocation Cloudroutines payload.
enum Source {
  // Unused proto3 zero value. Historical snooron-worker-devvit producer.
  SNOORON_WORKER_DEVVIT = 0 [deprecated = true];
  // Evaluator pipeline (example: incoming evaluator trigger events).
  EVALUATOR = 1;
}

// Cloudroutines payload for invoking one app installation. Published and
// consumed by gateway-execute (createTriggerInvocations / HandleTriggerInvocation).
message TriggerInvocation {
  // Installation UUID to invoke (example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890").
  string installation_id = 1;
  // Trigger event payload delivered to the app.
  devvit.data.triggers.v1alpha.TriggerEvent evt = 2;
  // Producer of this invocation (example: EVALUATOR).
  Source source = 3;
}

message PreflightInstallChangedRequest {
  reserved 3;
  reserved "temporary_installation_id";

  devvit.dev_portal.installation.InstallationInfo installation = 1;
  string target_app_version_id = 2;
}

// Install and settings lifecycle RPCs used by Dev Portal.
service TriggersV2 {
  rpc OnInstall(devvit.dev_portal.installation.InstallationInfo) returns (google.protobuf.Empty);
  // Deprecated, only used for apps on compute-go runtime
  rpc OnInstallChanged(devvit.dev_portal.installation.InstallationInfo) returns (google.protobuf.Empty);
  // Attempts preflight triggers for installation upgrades, such as invoking the app's OnAppUpgrade trigger
  rpc PreflightInstallChanged(PreflightInstallChangedRequest) returns (google.protobuf.Empty);
  // Performs post-installation-upgrade steps after committing an upgrade to the database
  rpc FinalizeInstallChanged(devvit.dev_portal.installation.InstallationInfo) returns (google.protobuf.Empty);
  rpc OnUninstall(devvit.dev_portal.installation.InstallationInfo) returns (google.protobuf.Empty);
  rpc OnInstallSettingsChanged(devvit.dev_portal.installation.InstallationInfo) returns (google.protobuf.Empty);
}
